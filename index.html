/* =========================
   BOOSTPRO USER SYSTEM
========================= */

function getUser() {
  return JSON.parse(localStorage.getItem("boostproUser"));
}


/* =========================
   SIGN UP
========================= */

function signupUser(event) {

  event.preventDefault();

  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  const user = {
    name: name,
    email: email,
    password: password
  };

  localStorage.setItem(
    "boostproUser",
    JSON.stringify(user)
  );

  localStorage.setItem(
    "boostproLoggedIn",
    "true"
  );

  alert("Account created successfully!");

  window.location.href = "dashboard.html";
}


/* =========================
   LOGIN
========================= */

function loginUser(event) {

  event.preventDefault();

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const user = getUser();

  if (!user) {

    alert(
      "No account found. Please create an account first."
    );

    return;
  }

  if (
    email === user.email &&
    password === user.password
  ) {

    localStorage.setItem(
      "boostproLoggedIn",
      "true"
    );

    window.location.href = "dashboard.html";

  } else {

    alert("Incorrect email or password.");

  }
}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

  localStorage.removeItem(
    "boostproLoggedIn"
  );

  window.location.href = "index.html";
}


/* =========================
   BOOSTPRO SERVICES
========================= */

const boostproServices = {

  "Social Media Marketing": {

    "Starter": 5000,
    "Standard": 10000,
    "Professional": 20000

  },

  "Content Creation": {

    "Basic": 7500,
    "Premium": 15000,
    "Professional": 30000

  },

  "Analytics Report": {

    "Basic": 5000,
    "Advanced": 12000,
    "Professional": 25000

  },

  "Campaign Promotion": {

    "Starter": 10000,
    "Growth": 25000,
    "Premium": 50000

  }

};


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(amount) {

  return "₦" +
    Number(amount).toLocaleString("en-NG");

}


/* =========================
   LOAD PACKAGES
========================= */

function updatePackages() {

  const service =
    document.getElementById("service");

  const packageSelect =
    document.getElementById("package");

  if (!service || !packageSelect) return;

  const selectedService =
    service.value;

  packageSelect.innerHTML =
    '<option value="">Choose a package</option>';

  if (!selectedService) {

    packageSelect.disabled = true;

    updatePrice();

    return;
  }

  const packages =
    boostproServices[selectedService];

  Object.entries(packages).forEach(
    ([packageName, price]) => {

      const option =
        document.createElement("option");

      option.value = packageName;

      option.textContent =
        `${packageName} — ${formatMoney(price)}`;

      packageSelect.appendChild(option);

    }
  );

  packageSelect.disabled = false;

  updatePrice();
}


/* =========================
   UPDATE PRICE
========================= */

function updatePrice() {

  const serviceElement =
    document.getElementById("service");

  const packageElement =
    document.getElementById("package");

  const quantityElement =
    document.getElementById("quantity");

  const packagePriceElement =
    document.getElementById("packagePrice");

  const totalPriceElement =
    document.getElementById("totalPrice");

  const quantityDisplay =
    document.getElementById("quantityDisplay");

  if (
    !serviceElement ||
    !packageElement ||
    !quantityElement
  ) return;

  const service =
    serviceElement.value;

  const packageName =
    packageElement.value;

  let quantity =
    parseInt(quantityElement.value) || 1;

  if (quantity < 1) quantity = 1;

  if (quantity > 100) quantity = 100;

  quantityElement.value = quantity;

  if (quantityDisplay) {
    quantityDisplay.textContent = quantity;
  }

  let price = 0;

  if (
    service &&
    packageName &&
    boostproServices[service] &&
    boostproServices[service][packageName]
  ) {

    price =
      boostproServices[service][packageName];

  }

  const total =
    price * quantity;

  if (packagePriceElement) {

    packagePriceElement.textContent =
      formatMoney(price);

  }

  if (totalPriceElement) {

    totalPriceElement.textContent =
      formatMoney(total);

  }
}


/* =========================
   CREATE ORDER
========================= */

function createOrder(event) {

  event.preventDefault();

  const service =
    document.getElementById("service").value;

  const packageName =
    document.getElementById("package").value;

  const platform =
    document.getElementById("platform").value;

  const target =
    document.getElementById("target").value;

  const notes =
    document.getElementById("notes").value;

  const quantity =
    parseInt(
      document.getElementById("quantity").value
    ) || 1;


  if (!service || !packageName) {

    alert("Please select a service and package.");

    return;
  }


  const price =
    boostproServices[service][packageName];


  const total =
    price * quantity;


  const orders =
    JSON.parse(
      localStorage.getItem("boostproOrders")
    ) || [];


  const order = {

    id: "BP" + Date.now(),

    service: service,

    package: packageName,

    platform: platform,

    target: target,

    notes: notes,

    quantity: quantity,

    price: price,

    total: total,

    status: "Pending",

    date: new Date().toLocaleDateString("en-NG")

  };


  orders.push(order);


  localStorage.setItem(
    "boostproOrders",
    JSON.stringify(orders)
  );


  alert(
    "Order created successfully!\n\n" +
    "Total: " +
    formatMoney(total)
  );


  window.location.href =
    "orders.html";
}


/* =========================
   LOAD ORDERS
========================= */

function loadOrders() {

  const container =
    document.getElementById("ordersList");

  if (!container) return;


  const orders =
    JSON.parse(
      localStorage.getItem("boostproOrders")
    ) || [];


  if (orders.length === 0) {

    container.innerHTML = `

      <div class="empty">

        <h2>No orders yet</h2>

        <p>
          Create your first order to get started.
        </p>

        <a
          href="order.html"
          class="btn primary"
        >
          Create Order
        </a>

      </div>

    `;

    return;
  }


  container.innerHTML =
    orders.map(order => `

      <div class="order-card">

        <div>

          <span class="order-id">
            ${order.id}
          </span>

          <h3>
            ${order.service}
          </h3>

          <p>
            Package: ${order.package}
          </p>

          <p>
            Platform: ${order.platform}
          </p>

          <p>
            Quantity: ${order.quantity}
          </p>

          <strong>
            ${formatMoney(order.total)}
          </strong>

          <br>

          <small>
            ${order.date}
          </small>

        </div>

        <span class="status">
          ${order.status}
        </span>

      </div>

    `).join("");

}


/* =========================
   DASHBOARD
========================= */

function loadDashboard() {

  const user =
    getUser();


  const name =
    document.getElementById(
      "dashboardName"
    );


  if (name && user) {

    name.textContent =
      user.name + " 👋";

  }


  const orders =
    JSON.parse(
      localStorage.getItem(
        "boostproOrders"
      )
    ) || [];


  const orderCount =
    document.getElementById(
      "orderCount"
    );


  if (orderCount) {

    orderCount.textContent =
      orders.length;

  }

}


/* =========================
   PROFILE
========================= */

function loadProfile() {

  const user =
    getUser();


  const name =
    document.getElementById(
      "profileName"
    );

  const email =
    document.getElementById(
      "profileEmail"
    );


  if (user) {

    if (name)
      name.value = user.name;

    if (email)
      email.value = user.email;

  }

}


/* =========================
   SAVE PROFILE
========================= */

function saveProfile() {

  const user =
    getUser();

  if (!user) return;


  user.name =
    document.getElementById(
      "profileName"
    ).value;


  localStorage.setItem(
    "boostproUser",
    JSON.stringify(user)
  );


  alert(
    "Profile updated successfully!"
  );

}


/* =========================
   START BOOSTPRO
========================= */

loadOrders();

loadDashboard();

loadProfile();

updatePackages();

updatePrice();

  background: #f5f7fb;
  color: #111827;
}

a {
  text-decoration: none;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  color: #111827;
}

.logo span {
  color: #2563eb;
}

/* NAVBAR */

.navbar {
  height: 75px;
  padding: 0 7%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.navbar nav {
  display: flex;
  align-items: center;
  gap: 25px;
}

.navbar nav a {
  color: #374151;
}

.nav-btn {
  background: #2563eb;
  color: white !important;
  padding: 11px 18px;
  border-radius: 7px;
}

/* HERO */

.hero {
  min-height: 650px;
  padding: 100px 7%;
  display: flex;
  align-items: center;
  background:
    radial-gradient(circle at 80% 30%, #2563eb55, transparent 35%),
    #0f172a;
  color: white;
}

.hero-content {
  max-width: 750px;
}

.badge {
  background: #2563eb33;
  border: 1px solid #2563eb;
  padding: 8px 14px;
  border-radius: 30px;
  display: inline-block;
  margin-bottom: 25px;
}

.hero h1 {
  font-size: clamp(40px, 7vw, 75px);
  line-height: 1;
  margin-bottom: 25px;
}

.hero h1 span {
  color: #60a5fa;
  display: block;
}

.hero p {
  color: #cbd5e1;
  font-size: 19px;
  max-width: 600px;
  margin-bottom: 30px;
}

.hero-buttons {
  display: flex;
  gap: 12px;
}

/* BUTTONS */

.btn {
  display: inline-block;
  padding: 14px 22px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: #2563eb;
  color: white;
}

.primary:hover {
  background: #1d4ed8;
}

.outline {
  border: 1px solid #94a3b8;
  color: white;
}

/* SECTIONS */

.section {
  padding: 90px 7%;
}

.section-heading {
  text-align: center;
  margin-bottom: 45px;
}

.section-heading span {
  color: #2563eb;
  font-size: 13px;
  font-weight: bold;
}

.section-heading h2 {
  font-size: 40px;
  margin: 8px 0;
}

.section-heading p {
  color: #6b7280;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

.service-card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  border: 1px solid #e5e7eb;
  transition: .2s;
}

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px #00000012;
}

.service-icon {
  font-size: 40px;
  margin-bottom: 15px;
}

.service-card h3 {
  margin-bottom: 10px;
}

.service-card p {
  color: #6b7280;
  margin-bottom: 20px;
}

.service-card a {
  color: #2563eb;
  font-weight: bold;
}

/* DARK */

.dark-section {
  background: #0f172a;
  color: white;
}

.light h2 {
  color: white;
}

.light p {
  color: #94a3b8;
}

.feature-grid {
  max-width: 1000px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}

.feature-grid div {
  padding: 25px;
  background: #1e293b;
  border-radius: 12px;
}

.feature-grid p {
  color: #94a3b8;
  margin-top: 10px;
}

/* FOOTER */

footer {
  background: #020617;
  color: #94a3b8;
  padding: 30px 7%;
  display: flex;
  justify-content: space-between;
}

/* AUTH */

.auth-body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef4ff;
  padding: 20px;
}

.auth-card {
  background: white;
  width: 100%;
  max-width: 430px;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 15px 50px #00000015;
}

.auth-card h1 {
  margin-top: 30px;
  margin-bottom: 8px;
}

.auth-card > p {
  color: #6b7280;
  margin-bottom: 25px;
}

.auth-card form {
  display: flex;
  flex-direction: column;
}

label {
  font-weight: bold;
  margin: 15px 0 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #2563eb;
}

.full {
  width: 100%;
  margin-top: 20px;
}

.auth-link {
  text-align: center;
  margin-top: 20px;
}

.auth-link a {
  color: #2563eb;
}

/* DASHBOARD */

.dashboard-layout {
  min-height: 100vh;
  display: flex;
}

.sidebar {
  width: 250px;
  background: #0f172a;
  padding: 30px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar .logo {
  color: white;
  margin: 0 12px 30px;
}

.sidebar a {
  color: #94a3b8;
  padding: 13px;
  border-radius: 8px;
}

.sidebar a:hover,
.sidebar a.active {
  background: #1e293b;
  color: white;
}

.logout {
  margin-top: auto;
  background: #dc2626;
  border: none;
  padding: 13px;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.dashboard-main {
  flex: 1;
  padding: 40px;
  overflow-x: auto;
}

.dashboard-top {
  margin-bottom: 30px;
}

.dashboard-top p,
.muted {
  color: #6b7280;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}

.stat-card span {
  font-size: 25px;
}

.stat-card h3 {
  font-size: 30px;
  margin-top: 10px;
}

.stat-card p {
  color: #6b7280;
}

.dashboard-card,
.form-card {
  background: white;
  padding: 30px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  margin-top: 30px;
}

.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.quick-actions a {
  padding: 20px;
  background: #f8fafc;
  color: #111827;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ORDERS */

.orders-container {
  margin-top: 25px;
}

.order-card {
  background: white;
  padding: 25px;
  margin-bottom: 15px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.order-id {
  color: #2563eb;
  font-weight: bold;
}

.order-card h3 {
  margin: 8px 0;
}

.order-card p,
.order-card small {
  color: #6b7280;
}

.status {
  background: #fef3c7;
  color: #92400e;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
}

.empty {
  background: white;
  text-align: center;
  padding: 60px;
  border-radius: 12px;
}

.dashboard-services {
  margin-top: 30px;
}

/* MOBILE */

@media (max-width: 900px) {

  .service-grid,
  .feature-grid {
    grid-template-columns: 1fr 1fr;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }

  .quick-actions {
    grid-template-columns: 1fr 1fr;
  }

}

@media (max-width: 650px) {

  .navbar nav a:not(.nav-btn) {
    display: none;
  }

  .hero {
    padding: 80px 5%;
  }

  .hero-buttons {
    flex-direction: column;
  }

  .section {
    padding: 60px 5%;
  }

  .service-grid,
  .feature-grid,
  .stats-grid {
    grid-template-columns: 1fr;
  }

  .dashboard-layout {
    display: block;
  }

  .sidebar {
    width: 100%;
  }

  .sidebar .logout {
    margin-top: 10px;
  }

  .dashboard-main {
    padding: 25px 15px;
  }

  .quick-actions {
    grid-template-columns: 1fr;
  }

  footer {
    flex-direction: column;
    gap: 15px;
  }

  .order-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
  }

}
Writing

/* =========================
   STAGE 2 ORDER SYSTEM
========================= */

.order-form-card {
  max-width: 850px;
  margin-left: auto;
  margin-right: auto;
}

.form-heading {
  margin-bottom: 25px;
}

.form-heading h1 {
  font-size: 36px;
  margin: 12px 0 8px;
}

.badge-small {
  display: inline-block;
  background: #eff6ff;
  color: #2563eb;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}


/* PRICE BOX */

.price-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 25px 0;
}

.price-preview > div {
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  padding: 20px;
  border-radius: 12px;
}

.price-preview span {
  display: block;
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 7px;
}

.price-preview strong {
  font-size: 22px;
}

.price-preview .total-price {
  background: #eff6ff;
  border-color: #bfdbfe;
}

.price-preview .total-price strong {
  color: #2563eb;
  font-size: 25px;
}


/* SELECT */

select:disabled {
  background: #f1f5f9;
  cursor: not-allowed;
}


/* ORDER CARD UPDATE */

.order-card strong {
  display: inline-block;
  margin-top: 8px;
  color: #2563eb;
  font-size: 18px;
}

.order-card p {
  margin-top: 4px;
}


/* MOBILE */

@media (max-width: 650px) {

  .order-form-card {
    padding: 20px;
  }

  .form-heading h1 {
    font-size: 28px;
  }

  .price-preview {
    grid-template-columns: 1fr;
  }

}
