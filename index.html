<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoostPro | Social Media Growth</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #fff;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      width: 100%;
      padding: 18px 7%;
      background: rgba(10, 10, 10, 0.96);
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 1px;
    }

    .logo span {
      color: #fff;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ffd700;
    }

    .nav-btn {
      background: #ffd700;
      color: #111 !important;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 800 !important;
    }

    .nav-btn:hover {
      background: #fff;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 7%;
      background:
        radial-gradient(circle at top, rgba(255, 215, 0, 0.25), transparent 40%),
        linear-gradient(135deg, #050505, #1c1600, #050505);
    }

    .hero-content {
      max-width: 900px;
    }

    .badge {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid #ffd700;
      color: #ffd700;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: #ffd700;
    }

    .hero p {
      color: #d5d5d5;
      font-size: 18px;
      line-height: 1.7;
      max-width: 700px;
      margin: auto;
    }

    .hero-buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 800;
      transition: 0.3s;
    }

    .primary-btn {
      background: #ffd700;
      color: #111;
      box-shadow: 0 8px 30px rgba(255, 215, 0, 0.2);
    }
