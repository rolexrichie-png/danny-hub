<html lang="en">
<head>

  <title>BoostPro | Social Media Growth</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    /* NAVBAR */
    header {
      width: 100%;
      padding: 18px 7%;
      background: rgba(0, 0, 0, 0.85);
      border-bottom: 1px solid rgba(255, 193, 7, 0.35);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      color: #ffd700;
    }

    .logo span {
      color: white;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #ffd700;
    }

    .nav-btn {
      background: #ffd700;
      color: #111 !important;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* HERO */
    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 7%;
      background:
        radial-gradient(circle at top, rgba(255, 215, 0, 0.25), transparent 40%),
        linear-gradient(135deg, #080808, #1b1500, #080808);
    }

    .hero-content {
      max-width: 900px;
    }

      display: inline-block;

      border-radius: 30px;
      margin-bottom: 22px;
      font-size: 14px;
      font-weight: bold;
    }

    .hero h1 {

      line-height: 1.05;
      margin-bottom: 22px;
