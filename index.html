<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoostPro | Social Media Growth</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0b0b0b;
      color: #fff;
      overflow-x: hidden;
    }

    /* ================= HEADER ================= */

    header {
      width: 100%;
      padding: 18px 7%;
      background: #111;
      border-bottom: 1px solid rgba(255, 215, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 1px;
    }

    .logo span {
      color: white;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ffd700;
    }

    .nav-btn {
      background: #ffd700;
      color: #111 !important;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 800 !important;
    }

    .nav-btn:hover {
      background: #fff;
      color: #111 !important;
    }

    .hero {

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 7%;
      background:
        radial-gradient(circle at top, rgba(255, 215, 0, 0.22), transparent 40%),
        linear-gradient(135deg, #050505, #191300, #050505);
    }

    .hero-content {
      max-width: 850px;
    }

      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 22px;
    }
