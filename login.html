<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoostPro | Login</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #063b2b, #0a9b61, #dff8e9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-logo a {
      color: white;
      font-size: 32px;
      font-weight: 800;
      text-decoration: none;
    }

    .auth-logo span {
      color: #a8f5c9;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.98);
      padding: 38px;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .auth-card h1 {
      color: #063b2b;
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #26352f;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d6e7df;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #0a9b61;
      box-shadow: 0 0 0 3px rgba(10, 155, 97, 0.12);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 22px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #667085;
    }

    .remember input {
      accent-color: #0a9b61;
    }

    .forgot {
      color: #087647;
      text-decoration: none;
      font-weight: 600;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #087647, #0a9b61);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(10, 155, 97, 0.25);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #98a2b3;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .signup-link {
      text-align: center;
      color: #667085;
      font-size: 14px;
    }

    .signup-link a {
      color: #087647;
      font-weight: 700;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 22px;
      }

      .auth-logo a {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <div class="auth-logo">
      <a href="index.html">Boost<span>Pro</span></a>
    </div>

    <div class="auth-card">

      <h1>Welcome Back 👋</h1>

      <p class="auth-subtitle">
        Login to manage your BoostPro account.
      </p>

      <form action="dashboard.html" method="get">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="form-options">

          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="#" class="forgot">
            Forgot password?
          </a>

        </div>

        <button type="submit" class="login-btn">
          Login to Dashboard
        </button>

      </form>

      <div class="divider">OR</div>

      <p class="signup-link">
        Don't have an account?
        <a href="signup.html">Create an account</a>
      </p>

    </div>

    <a href="index.html" class="back-home">
      ← Back to Homepage
    </a>

  </div>

</body>
</html>
