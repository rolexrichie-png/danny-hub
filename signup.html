BoostPro Professional Sign-Up Page

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoostPro | Create Account</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #052e16, #166534, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      color: white;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .logo span {
      color: #86efac;
    }

    .card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .card h1 {
      text-align: center;
      color: #14532d;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .input-box {
      position: relative;
    }

    .input-box input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    .input-box input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 5px 0 20px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }

    .terms input {
      margin-top: 3px;
      accent-color: #16a34a;
    }

    .terms a {
      color: #16a34a;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25);
    }

    .signup-btn:hover {
      transform: translateY(-1px);
    }

    .signup-btn:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    .login-text {
      text-align: center;
      margin-top: 23px;
      color: #64748b;
      font-size: 14px;
    }

    .login-text a {
      color: #16a34a;
      font-weight: 700;
      text-decoration: none;
    }

    .security {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }

      .logo {
        font-size: 28px;
      }

      .card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Boost<span>Pro</span>
    </div>

    <div class="card">

      <h1>Create Your Account</h1>

      <p class="subtitle">
        Join BoostPro and manage your social media services.
      </p>

      <form id="signupForm">

        <div class="input-group">
          <label for="name">Full Name</label>

          <div class="input-box">
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
            >
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>

          <div class="input-box">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            >
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>

          <div class="input-box">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword('password', this)"
            >
              Show
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="input-box">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword('confirmPassword', this)"
            >
              Show
            </button>
          </div>
        </div>

        <div class="terms">
          <input type="checkbox" id="terms" required>

          <label for="terms">
            I agree to the
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>.
          </label>
        </div>

        <button type="submit" class="signup-btn">
          Create Account
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="login-text">
        Already have an account?
        <a href="login.html">Log In</a>
      </div>

      <div class="security">
        🔒 Your account information is protected.
      </div>

    </div>

  </div>

  <script>

    function togglePassword(inputId, button) {

      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
      } else {
        input.type = "password";
        button.textContent = "Show";
      }
    }


    document
      .getElementById("signupForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");


        if (password !== confirmPassword) {

          message.style.color = "#dc2626";

          message.textContent =
            "Passwords do not match.";

          return;
        }


        if (password.length < 6) {

          message.style.color = "#dc2626";

          message.textContent =
            "Password must be at least 6 characters.";

          return;
        }


        /*
          This section works with the simple
          localStorage account system.

          If your existing script.js already handles
          signup, we can connect this form to it next.
        */

        const users =
          JSON.parse(localStorage.getItem("boostpro_users")) || [];


        const existingUser =
          users.find(user => user.email === email);


        if (existingUser) {

          message.style.color = "#dc2626";

          message.textContent =
            "An account with this email already exists.";

          return;
        }


        users.push({
          name: name,
          email: email,
          password: password
        });


        localStorage.setItem(
          "boostpro_users",
          JSON.stringify(users)
        );


        localStorage.setItem(
          "boostpro_current_user",
          JSON.stringify({
            name: name,
            email: email
          })
        );


        message.style.color = "#16a34a";

        message.textContent =
          "Account created successfully!";


        setTimeout(function() {

          window.location.href = "dashboard.html";

        }, 1000);

      });

  </script>

</body>
          </html>
