<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoostPro | Create Account</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #063b2b, #0a9b61, #dff8e9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-logo a {
      color: white;
      font-size: 32px;
      font-weight: 800;
      text-decoration: none;
    }

    .auth-logo span {
      color: #a8f5c9;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.98);
      padding: 38px;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .auth-card h1 {
      color: #063b2b;
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      color: #26352f;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d6e7df;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #0a9b61;
      box-shadow: 0 0 0 3px rgba(10, 155, 97, 0.12);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
      margin: 5px 0 20px;
    }

    .terms input {
      margin-top: 3px;
      accent-color: #0a9b61;
    }

    .terms a {
      color: #087647;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #087647, #0a9b61);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(10, 155, 97, 0.25);
    }

    .login-link {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-top: 23px;
    }

    .login-link a {
      color: #087647;
      font-weight: 700;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 22px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .auth-logo a {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <div class="auth-logo">
      <a href="index.html">Boost<span>Pro</span></a>
    </div>

    <div class="auth-card">

      <h1>Create Your Account 🚀</h1>

      <p class="auth-subtitle">
        Join BoostPro and start growing your social media presence.
      </p>

      <form action="dashboard.html" method="get">

        <div class="form-row">

          <div class="form-group">
            <label for="firstName">First Name</label>

            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="First name"
              required
            >
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>

            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Last name"
              required
            >
          </div>

        </div>


        <div class="form-group">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="form-group">

          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            required
          >

        </div>


        <label class="terms">

          <input type="checkbox" required>

          <span>
            I agree to the
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>.
          </span>

        </label>


        <button type="submit" class="signup-btn">
          Create Account
        </button>

      </form>


      <p class="login-link">

        Already have an account?

        <a href="login.html">
          Login here
        </a>

      </p>

    </div>


    <a href="index.html" class="back-home">
      ← Back to Homepage
    </a>

  </div>

</body>
</html>
