<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BoostPro | Place Order</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top left,
          rgba(212, 175, 55, 0.16),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(0, 100, 50, 0.25),
          transparent 35%
        ),
        #050805;
      min-height: 100vh;
      color: #ffffff;
    }

    /* ================= TOPBAR ================= */

    .topbar {
      background: rgba(5, 8, 5, 0.96);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);

      padding: 18px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 1000;

      backdrop-filter: blur(12px);
    }

    .logo {
      color: #d4af37;
      font-size: 26px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: #cccccc;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: 0.25s;
    }

    .nav-links a:hover {
      color: #d4af37;
    }

    /* ================= CONTAINER ================= */

    .order-container {
      width: 92%;
      max-width: 900px;
      margin: 45px auto 70px;
    }

    /* ================= HEADER ================= */

    .order-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .order-header .badge {
      display: inline-block;

      padding: 7px 13px;

      margin-bottom: 12px;

      border: 1px solid rgba(212, 175, 55, 0.35);

      border-radius: 30px;

      color: #d4af37;

      background: rgba(212, 175, 55, 0.07);

      font-size: 12px;
    }

    .order-header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .order-header p {
      color: #999999;
      font-size: 14px;
    }

    /* ================= CARD ================= */

    .order-card {
      background:
        linear-gradient(
          145deg,
          rgba(15, 23, 15, 0.98),
          rgba(7, 11, 7, 0.98)
        );

      border: 1px solid rgba(212, 175, 55, 0.25);

      padding: 35px;

      border-radius: 20px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 21px;
    }

    .form-group label {
      display: block;

      font-weight: 700;

      margin-bottom: 8px;

      color: #dddddd;

      font-size: 14px;
    }

    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;

      padding: 14px;

      border: 1px solid #293529;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      background: #080d08;

      color: #ffffff;

      transition: 0.25s;
    }

    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #d4af37;

      box-shadow:
        0 0 0 3px rgba(212, 175, 55, 0.07);
    }

    .form-group select option {
      background: #080d08;
      color: #ffffff;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #626a62;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* ================= PRICE ================= */

    .price-box {
      background:
        linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.10),
          rgba(0, 90, 45, 0.13)
        );

      border: 1px solid rgba(212, 175, 55, 0.25);

      padding: 20px;

      border-radius: 13px;

      margin: 25px 0;
    }

    .price-box h3 {
      color: #d4af37;

      margin-bottom: 7px;

      font-size: 14px;
    }

    .price {
      font-size: 30px;

      font-weight: 800;

      color: #ffffff;
    }

    .price-info {
      color: #777f77;

      font-size: 12px;

      margin-top: 5px;
    }

    /* ================= BUTTON ================= */

    .submit-btn {
      width: 100%;

      border: none;

      padding: 15px;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #d4af37,
          #f0d56b
        );

      color: #050805;

      font-size: 16px;

      font-weight: 800;

      cursor    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #5ee59b;
    }

    .order-container {
      width: 92%;
      max-width: 900px;
      margin: 40px auto;
    }

    .order-header {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }

    .order-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .order-header p {
      opacity: 0.9;
    }

    .order-card {
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #063b2b;
    }

    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5e7dd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #0a9b61;
      box-shadow: 0 0 0 3px rgba(10,155,97,0.12);
    }

    .price-box {
      background: #e6f8ee;
      border: 1px solid #b9e8cf;
      padding: 18px;
      border-radius: 12px;
      margin: 25px 0;
    }

    .price-box h3 {
      color: #087647;
      margin-bottom: 7px;
    }

    .price {
      font-size: 28px;
      font-weight: 800;
      color: #063b2b;
    }

    .submit-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 10px;
      background: linear-gradient(135deg, #087647, #0a9b61);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(10,155,97,0.25);
    }

    .note {
      text-align: center;
      margin-top: 18px;
      color: #667085;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .order-card {
        padding: 24px 18px;
      }

      .order-header h1 {
        font-size: 26px;
      }

      .nav-links {
        gap: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="index.html" class="logo">BoostPro</a>

    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="orders.html">Orders</a>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main class="order-container">

    <div class="order-header">
      <h1>Place a New Order 🚀</h1>
      <p>Choose a service and start growing your social media presence.</p>
    </div>

    <div class="order-card">

      <form action="orders.html" method="get">

        <div class="form-group">
          <label for="platform">Select Platform</label>

          <select id="platform" name="platform" required>
            <option value="">Choose a platform</option>
            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
            <option value="youtube">YouTube</option>
            <option value="facebook">Facebook</option>
          </select>
        </div>

        <div class="form-group">
          <label for="service">Select Service</label>

          <select id="service" name="service" required>
            <option value="">Choose a service</option>
            <option value="followers">Followers</option>
            <option value="likes">Likes</option>
            <option value="views">Views</option>
            <option value="subscribers">Subscribers</option>
            <option value="engagement">Engagement</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>

          <input
            type="number"
            id="quantity"
            name="quantity"
            placeholder="Enter quantity"
            min="1"
            required
          >
        </div>

        <div class="form-group">
          <label for="link">Social Media Link</label>

          <input
            type="url"
            id="link"
            name="link"
            placeholder="https://..."
            required
          >
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes</label>

          <textarea
            id="notes"
            name="notes"
            rows="4"
            placeholder="Add any special instructions..."
          ></textarea>
        </div>

        <div class="price-box">
          <h3>Estimated Price</h3>
          <div class="price">₦0.00</div>
        </div>

        <button type="submit" class="submit-btn">
          🚀 Place Order
        </button>

      </form>

      <p class="note">
        Please make sure your social media link is correct before submitting.
      </p>

    </div>

  </main>

</body>
</html>
