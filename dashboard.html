    /* =========================
       DASHBOARD DESIGN
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f8f4;
      color: #172033;
    }

    /* Navigation */
    .dashboard-nav {
      background: #063b2b;
      color: white;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .dashboard-logo {
      font-size: 25px;
      font-weight: 800;
      color: #5ee59b;
    }

    .dashboard-nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .dashboard-nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .dashboard-nav-links a:hover {
      color: #5ee59b;
    }

    .logout-btn {
      background: #39c878;
      color: white !important;
      padding: 10px 18px;
      border-radius: 8px;
    }
